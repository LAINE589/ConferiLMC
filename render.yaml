services:
  - type: web
    name: sistema-lmc
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 180
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lmc-db
          property: connectionString

databases:
  - name: lmc-db
    databaseName: lmc
    user: lmc
    plan: free
